<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#120224" />
      <stop offset="50%" stopColor="#2c004d" />
      <stop offset="100%" stopColor="#ff007f" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffff55" />
      <stop offset="60%" stopColor="#ff5500" />
      <stop offset="100%" stopColor="#ff007f" />
    </linearGradient>
    <linearGradient id="mintCar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#3ebd90" />
      <stop offset="50%" stopColor="#41cc9c" />
      <stop offset="100%" stopColor="#55efc4" />
    </linearGradient>
    <linearGradient id="bronzeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d4af37" />
      <stop offset="100%" stopColor="#8a6223" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Retro Sun -->
  <circle cx="256" cy="220" r="130" fill="url(#sunGrad)" />

  <!-- Sun Horizontal Blinds Slices -->
  <rect x="120" y="195" width="272" height="10" fill="#2c004d" />
  <rect x="130" y="225" width="252" height="14" fill="#2c004d" />
  <rect x="145" y="260" width="222" height="18" fill="#2c004d" />
  <rect x="165" y="300" width="182" height="22" fill="#2c004d" />

  <!-- Palm Tree Silhouettes -->
  <path d="M70,390 Q90,300 130,250 Q100,230 60,250 Q110,210 140,240 Q130,190 100,200 Q150,210 150,250 Q180,210 200,240 Q160,260 140,260 Q110,310 90,390 Z" fill="#0d011a" opacity="0.8" />

  <!-- Mint Green BMW M5 Silhouette / Stance Car -->
  <g transform="translate(45, 170)">
    <!-- Shadow -->
    <ellipse cx="210" cy="180" rx="190" ry="24" fill="#000000" opacity="0.6" />

    <!-- Car Body -->
    <path d="M 40,150 
             L 70,120 
             L 130,90 
             L 240,85 
             L 310,115 
             L 375,130 
             Q 385,145 375,158 
             L 345,160 
             Q 335,125 295,125 
             Q 255,125 245,160 
             L 135,160 
             Q 125,125 85,125 
             Q 45,125 35,160 
             Z" fill="url(#mintCar)" stroke="#111" stroke-width="4" />

    <!-- Windows (Dark Tint) -->
    <path d="M 135,93 L 235,90 L 295,116 L 155,116 Z" fill="#15232d" />

    <!-- Wheels (Bronze Mesh with Chrome Lip) -->
    <!-- Front Wheel -->
    <circle cx="290" cy="155" r="32" fill="#151515" />
    <circle cx="290" cy="155" r="26" fill="url(#bronzeRim)" stroke="#eee" stroke-width="3" />
    <circle cx="290" cy="155" r="8" fill="#151515" />

    <!-- Rear Wheel -->
    <circle cx="90" cy="155" r="32" fill="#151515" />
    <circle cx="90" cy="155" r="26" fill="url(#bronzeRim)" stroke="#eee" stroke-width="3" />
    <circle cx="90" cy="155" r="8" fill="#151515" />

    <!-- Carbon Splitter & Headlight Glow -->
    <rect x="360" y="156" width="28" height="6" rx="2" fill="#222" />
    <ellipse cx="370" cy="142" rx="8" ry="4" fill="#00ffff" />
  </g>

  <!-- Title Text -->
  <text x="256" y="445" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-style="italic" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="3">VICE CITY</text>
  <text x="256" y="475" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">CRUISER</text>
</svg>
